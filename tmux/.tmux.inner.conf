# Config for a nested (inner) tmux server. Start it with:
#   tmux -L inner -f ~/.tmux.inner.conf
# or use the `itmux` shell function.
#
# Everything from the normal config, then the prefix moved off C-b so the
# outer session keeps C-b and only this inner one answers to C-a.
source-file ~/.tmux.conf

unbind-key C-b
set -g prefix C-a
bind-key C-a send-prefix

# prefix r in the main config re-sources ~/.tmux.conf, which would put the
# prefix back on C-b. Point it at this file instead.
bind r source-file ~/.tmux.inner.conf

# tmux-sensible also binds R to source ~/.tmux.conf. Same problem, same fix.
bind R source-file ~/.tmux.inner.conf
