# prefix is C-b (nested/inner sessions override this to C-a via .tmux.inner.conf)
set -g prefix C-b
bind-key C-b send-prefix

#act like vim
setw -g mode-keys vi
# prefix l = last-window (pane nav lives on Alt-h/j/k/l)
bind-key l last-window

# Alt-Tab / Alt-Shift-Tab cycle to next / previous window, no prefix needed.
# If the focused pane is itself running tmux or ssh, forward the key instead so
# the nested session cycles its own windows. The focused pane decides who answers.
bind -n M-Tab  if-shell 'echo "#{pane_current_command}" | grep -iqE "^(tmux|ssh)$"' 'send-keys M-Tab'  'next-window'
bind -n M-BTab if-shell 'echo "#{pane_current_command}" | grep -iqE "^(tmux|ssh)$"' 'send-keys M-BTab' 'previous-window'

# session picker, always sorted by name (so 01-/02- prefixes hold)
bind s choose-tree -s -O name

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# split windows
bind | split-window -h
bind - split-window -v


# set base window to 1 instead of 0
set -g base-index 1

#enabled mouse mode
set -g mouse on

# size window to the most-recently active client, and resize per-window
# so a smaller attached client no longer constrains the display (no dead-space dots)
set -g window-size latest
setw -g aggressive-resize on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

#Resurrect (Persist Sessions)
set -g @plugin 'tmux-plugins/tmux-resurrect'

#vim tmux navigator
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'dracula/tmux'

set -g @dracula-show-powerline true
set -g @dracula-fixed-location "Pembroke Pines Florida"
set -g @dracula-plugins "weather"
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session
set -g status-position top

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
